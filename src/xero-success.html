<!DOCTYPE html>
<html>
<head><title>Connecting Xero...</title></head>
<body>
<p>Connecting to Xero, please wait...</p>
<script>
fetch('/api/xero-token')
  .then(r => r.json())
  .then(data => {
    if (data.token && data.tenant) {
      localStorage.setItem('xero_token', data.token);
      localStorage.setItem('xero_tenant', data.tenant);
      window.location.href = '/#xero=connected';
    } else {
      window.location.href = '/#xero_error=no_token';
    }
  })
  .catch(() => window.location.href = '/#xero_error=fetch_failed');
</script>
</body>
</html>
